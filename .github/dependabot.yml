# Dependabot configuration.
# Version updates run weekly and are grouped per package family. Major bumps
# get their own PR, except for Microsoft.* packages, the .NET SDK and Docker
# images, where major bumps are ignored and must be upgraded manually.
# Security updates are not affected by the schedule and arrive right away.
version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    assignees: ["BoBoBaSs84"]
    labels: ["dependencies", "nuget"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns: ["Microsoft.*"]
        update-types: ["minor", "patch"]
      bb84:
        patterns: ["BB84.*"]
        update-types: ["minor", "patch"]
      testing:
        patterns: ["FluentAssertions", "Moq"]
        update-types: ["minor", "patch"]
      qrcoder:
        patterns: ["QRCoder*"]
        update-types: ["minor", "patch"]
      swagger:
        patterns: ["Swashbuckle.*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    assignees: ["BoBoBaSs84"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    assignees: ["BoBoBaSs84"]
    labels: ["dependencies", "dotnet-sdk"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Europe/Berlin"
    assignees: ["BoBoBaSs84"]
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
